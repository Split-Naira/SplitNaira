        content:
          application/json:
            schema:
              type: object
              properties:
                owner:
                  type: string
                  minLength: 1
                  description: owner
                collaborators:
                  type: array
                  items:
                    type: object
                    properties:
                      address:
                        type: string
                        minLength: 1
                      alias:
                        type: string
                        minLength: 1
                        maxLength: 100
                      basisPoints:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                        maximum: 10000
                    required:
                      - address
                      - alias
                      - basisPoints
                  minItems: 2
              required:
                - owner
                - collaborators
            example:
              owner: GBJRKIYXAAFD3NZCWJXGUTNKYUQFZC2ANS6LRMBPJCE4IZSMJJMZPQBT
              collaborators:
                - address: GCZTK3PNYXCVF7Z3ELVELEJZ7BVGPGPVJ3NVZNI7O6DVCHPA4JU6LXRV
