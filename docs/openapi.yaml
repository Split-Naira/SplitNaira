  /transactions/history:
    get:
      summary: Query payout transaction history
      description: Returns paginated payout records with optional wallet, date, and
        status filters.
      tags:
        - Transactions
      parameters:
        - schema:
            type: string
            pattern: ^G[A-Z2-7]{55}$
          required: false
          name: walletAddress
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: startDate
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: endDate
          in: query
        - schema:
            type: string
            enum:
              - pending
              - completed
              - failed
          required: false
          name: status
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: Paginated transaction history
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        roundId:
                          type: string
                        recipient:
                          type: string
                        amount:
                          type: string
                        token:
                          type: string
                        timestamp:
                          type: integer
                        txHash:
                          type: string
                        status:
                          type: string
                          enum:
                            - pending
                            - completed
                            - failed
                      required:
                        - id
                        - roundId
                        - recipient
                        - amount
                        - token
                        - timestamp
                        - txHash
                        - status
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
                required:
                  - transactions
                  - total
                  - limit
                  - offset
        "400":
          description: Validation error
          content:
            application/json:
