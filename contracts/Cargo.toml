
[package]
name = "splitnaira-contracts"
version = "0.1.0"
edition = "2021"
description = "Soroban smart contracts for SplitNaira — royalty splitting on Stellar"
license = "MIT"
repository = "https://github.com/Split-Naira/SplitNaira"

[lib]
name = "splitnaira_contract"
crate-type = ["cdylib", "rlib"]

[features]
# reliability_tests.rs is registered through #[cfg(test)] in lib.rs.
# Run tests with: cargo test --features testutils
testutils = ["soroban-sdk/testutils"]

[dependencies]
# Keep the Soroban SDK pinned to an exact version to avoid unexpected
# changes to contract behavior, storage costs, instruction limits, or XDR encoding.
# When upgrading, update Cargo.lock and validate against testnet.
soroban-sdk = { version = "=20.5.0" }

[dev-dependencies]
derive_arbitrary = "1.3.2"
soroban-sdk = { version = "=20.5.0", features = ["testutils"] }
dx_tooling = { path = "dx_tooling" }

# Optimized production build configuration.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = true
panic = "abort"

# Production optimization with debug assertions enabled for diagnostics.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
