[package]
name = "dx_tooling"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["chrono", "serde", "serde_json"]

[dependencies]
soroban-sdk = "20.0.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
